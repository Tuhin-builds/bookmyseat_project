<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Booking Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <h2>Booking Confirmed! 🎉</h2>
    <p>Thank you for booking with us. Here are your ticket details:</p>
    
    <hr style="border: 1px solid #eee;">
    
    <ul>
        <li><strong>Movie:</strong> {{ movie_title }}</li>
        <li><strong>Theater:</strong> {{ theater_name }}</li>
        <li><strong>Show Timing:</strong> {{ show_time }}</li>
        <li><strong>Seat Numbers:</strong> {{ seat_numbers }}</li>
        <li><strong>Payment ID:</strong> {{ payment_id }}</li>
    </ul>

    <p>Enjoy your movie!</p>
</body>
</html>
